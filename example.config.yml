## ---- Copy this to config.yml ----

this-service:
  stage: dev  # dev or prod
  host: localhost
  port:
    http: 9000
    tcp: 9001

  cloud-dir: 
  password-vault-salt: 

  replication:
    role: primary
    master-or-replica-ip: 
    # Optional (replica only). Glob patterns, relative to the cloud dir, that the
    # replica will NOT download or delete. Matching is case-sensitive.
    # e.g.
    # ignore-patterns:
    #   - "**/*.tmp"
    #   - "cache/**"
    #   - "user1/private/**"
    ignore-patterns: []

    mirror-dirs: []
    # Optional (replica only). Deployments the PRIMARY is allowed to trigger on this
    # node, by name. The primary sends only a task name — never a command — so it can
    # never make this replica run something not listed here. Omit the key entirely to
    # refuse all deploy requests, which is the default.
    deploy-tasks:
      - name: redeploy
        work-dir: __CWD__
        steps:
          - name: git pull
            cmd: git
            args: ["pull"]
          - name: npm install
            cmd: npm
            args: ["install"]
            timeout-ms: 600000
          - name: build
            cmd: npm
            args: ["run", "build"]
            timeout-ms: 600000
          # `triggers-restart` steps are reported as successful and the whole result is
          # flushed to the primary BEFORE the command fires, because afterwards this
          # process is gone and could not report anything.
          - name: restart
            cmd: pm2
            args: ["restart", "shado-cloud-replica"]
            triggers-restart: true

    # Optional (replica only). Set to false to skip database replication entirely
    # (the hourly DB dump/restore cycle); only files will be mirrored. Defaults to
    # true (databases are replicated) when omitted.
    replicate-database: true
  
  # CORS allowed origin(s). Supports a comma-separated list; each entry is trimmed,
  # e.g. "http://localhost:3000,https://localhost" (https://localhost is the Android
  # native WebView origin; capacitor://localhost for iOS is already allowed).
  frontend_url: http://localhost:3000

  # Emails sending and drive DB backup use this account secrets
  google:
    email: 
    client-id:
    client-secret:
    refresh-token:

  # Used for deployment pipelines
  deployment:
    github-webhook-secret: 

  # Secondary "cold storage" drives for the tiered_storage feature.
  # Each name maps to a mount point at /mnt/<name>; cold files live under /mnt/<name>/cloud-dir.
  # Files unaccessed for ~6 months are demoted here. Behaviour is controlled by three
  # feature flags (namespace "files"): tiered_storage_demotion, tiered_storage_promotion,
  # tiered_storage_gc — toggle each independently in the admin Flags tab.
  # Leave empty to disable demotion.
  cold-storage:
    drives: []


# X service communication
cross-service:
  # Shared secret between microservices (must match shado-auth-api's value)
  secret: rsfgrfsrfsr

  # Auth microservice (for cookie validation)
  auth-api:
    host: shado-auth-api
    port:
      http: 11001
      tcp: 11002
  
  # Metrics microservice (TCP for pushing metrics, HTTP for heartbeat)
  metrics-api:
    host: shado-metrics
    port:
      http: 14001
      tcp: 14002

db:
  type: mysql
  host: localhost
  port: 3306
  username: root
  password: password
  name: shado_cloud

redis:
  host: localhost
  port: 6379
  password: redispass

# Open-source, CloudWatch-Logs-style log store. When the `log:victoria_logs` feature flag is
# enabled (admin ▸ Flags), LoggerToDb pushes JSON-line logs here IN ADDITION to MySQL, so you
# can query them in Grafana (Explore ▸ VictoriaLogs, LogsQL). Optional — omit this whole block
# to keep logging to MySQL only. In docker the host is the service name; on a bare-metal prod
# host point it at wherever VictoriaLogs listens (default :9428).
victoria-logs:
  url: http://victoria-logs:9428

