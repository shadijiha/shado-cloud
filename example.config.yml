## ---- Copy this to config.yml ----

this-service:
  stage: dev  # dev or prod
  host: localhost
  port:
    http: 9000
    tcp: 9001

  cloud-dir: 
  password-vault-salt: 

  replication:
    role: primary
    master-or-replica-ip: 
    # Optional (replica only). Glob patterns, relative to the cloud dir, that the
    # replica will NOT download or delete. Matching is case-sensitive.
    # e.g.
    # ignore-patterns:
    #   - "**/*.tmp"
    #   - "cache/**"
    #   - "user1/private/**"
    ignore-patterns: []

    mirror-dirs: []

    # Optional (replica only). Set to false to skip database replication entirely
    # (the hourly DB dump/restore cycle); only files will be mirrored. Defaults to
    # true (databases are replicated) when omitted.
    replicate-database: true
  
  # CORS allowed origin(s). Supports a comma-separated list; each entry is trimmed,
  # e.g. "http://localhost:3000,https://localhost" (https://localhost is the Android
  # native WebView origin; capacitor://localhost for iOS is already allowed).
  frontend_url: http://localhost:3000

  # Emails sending and drive DB backup use this account secrets
  google:
    email: 
    client-id:
    client-secret:
    refresh-token:

  # Used for deployment pipelines
  deployment:
    github-webhook-secret: 
    # ── Propagate-to-replicas ──────────────────────────────────────────────
    # A deployment project can be flagged "propagate to replicas" in the admin
    # Deploy tab. When such a project deploys successfully on the MASTER, the master
    # pushes the steps marked "Run on replicas" to every connected replica over the
    # replica-link socket, and each replica runs them locally (typically `git pull`).
    #
    # NOTE: the git credential for that pull is NOT configured here. Replicas run in
    # Docker and the repo is cloned over HTTPS, so a PRIVATE repo needs a GitHub token
    # supplied as the `GIT_DEPLOY_TOKEN` ENVIRONMENT VARIABLE (see docker-compose.yml /
    # your .env), never in this file — it's written only to the container's ephemeral
    # filesystem at startup so it can't leak into image layers. Leave it unset for a
    # public repo. Create the token as a fine-grained PAT scoped to this repo with
    # Contents: Read-only (org owner approval may be required).

  # Secondary "cold storage" drives for the tiered_storage feature.
  # Each name maps to a mount point at /mnt/<name>; cold files live under /mnt/<name>/cloud-dir.
  # Files unaccessed for ~6 months are demoted here. Behaviour is controlled by three
  # feature flags (namespace "files"): tiered_storage_demotion, tiered_storage_promotion,
  # tiered_storage_gc — toggle each independently in the admin Flags tab.
  # Leave empty to disable demotion.
  cold-storage:
    drives: []


# X service communication
cross-service:
  # Shared secret between microservices (must match shado-auth-api's value)
  secret: rsfgrfsrfsr

  # Auth microservice (for cookie validation)
  auth-api:
    host: shado-auth-api
    port:
      http: 11001
      tcp: 11002
  
  # Metrics microservice (TCP for pushing metrics, HTTP for heartbeat)
  metrics-api:
    host: shado-metrics
    port:
      http: 14001
      tcp: 14002

db:
  type: mysql
  host: localhost
  port: 3306
  username: root
  password: password
  name: shado_cloud

redis:
  host: localhost
  port: 6379
  password: redispass

